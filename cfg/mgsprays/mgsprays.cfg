// MG Sprays: startup defaults. Not reloaded on map change.
// Set/query via server console, RCON, or @css/root.
// Runtime changes are not saved to this file.

// Enable sprays. 0 removes all existing sprays. Default: 1. Range: 0/1.
lp_mgspray_enabled "1"

// Lifetime in seconds, including existing sprays. Default: 120. Range: 1-3600.
lp_mgspray_lifetime_seconds "120"

// Maximum placement distance (Source units). Default: 128. Range: 1-1024.
lp_mgspray_max_distance "128"

// Projection depth for new sprays. Default: 4. Range: 1-16.
lp_mgspray_depth "4"

// Active spray limit. Existing sprays are preserved. Default: 64. Range: 1-256.
lp_mgspray_max_active "64"

// Sprays per player. At the limit, replace the oldest. Default: 1. Range: 1-256.
// Lowering this limit preserves existing sprays; each new spray replaces only one.
lp_mgspray_max_per_player "1"

// Cooldown after successful placement (seconds). 0 disables. Default: 0. Range: 0-3600.
lp_mgspray_cooldown_seconds "0"
// Angle offsets for new sprays (degrees). Default: 0. Range: -360 to 360.
lp_mgspray_pitch_offset "0"
lp_mgspray_yaw_offset "0"
lp_mgspray_roll_offset "0"

// Detailed server logs. Default: 1. Range: 0/1.
lp_mgspray_debug "1"


// Successful spray chat notification. Default: 1. Range: 0/1.
lp_mgspray_chat_enabled "1"

// Spray sounds for all players. Default: 1. Range: 0/1.
lp_mgspray_sound_enabled "1"

// Keep sprays across rounds. 0 clears them at round start. Default: 1. Range: 0/1.
lp_mgspray_keep_across_rounds "1"
